{% extends "frontend/base.html" %}
{% load static %}

{% block content %}
<link rel="stylesheet" href="{% static 'frontend/style.css' %}">
<link rel="stylesheet" href="{% static 'frontend/dashboard.css' %}">
<link rel="stylesheet" href="{% static 'frontend/model-view.css' %}">

<style>
    .evidence-status {
        display: inline-block;
        padding: 4px 8px;
        border-radius: 12px;
        font-weight: 700;
        font-size: 11px;
        align-self: center;
        margin-left: 8px;
        text-transform: uppercase;
    }
    .evidence-status.approved { background: #dcfce7; color: #065f46; }
    .evidence-status.in-review { background: #fff7ed; color: #92400e; }
    .evidence-status.rejected { background: #fee2e2; color: #991b1b; }
</style>

<div class="model-view-wrapper">
    <a id="back-button" aria-label="Volver">
        <!-- left arrow icon -->
        <svg viewBox="0 0 20 20" fill="none" width="18" height="18" aria-hidden="true">
            <path d="M11 15L6 10l5-5" stroke="#3b4854" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Volver a modelos
    </a>

    <div class="page-shell">
        <div id="criteria-tree-header">
            <div id="criteria-tree-title">
                <img src="{% static 'frontend/svgs/task.svg' %}" width="24" height="24">
                <h2>Árbol de Criterios</h2>
            </div>
            <button id="add-criterion-btn">
                <img src="{% static 'frontend/svgs/plus.svg'%}" width="22" height="22">
                Agregar Criterio
            </button>
        </div>
        <div id="criteria-container" class="criteria-tree">
            <!-- Criteria will be loaded here -->
        </div>
    </div>
</div>

<div id="criteria-modal-overlay" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="criteria-modal-title">
    <div class="modal-card">
        <div class="modal-header">
            <h3 id="criteria-modal-title">Agregar Criterio</h3>
            <button type="button" id="criteria-modal-close" class="modal-close-button" aria-label="Cerrar">×</button>
        </div>
        <div class="modal-description" id="criteria-modal-description">Define el código, título y descripción del nuevo criterio.</div>
        <form id="criteria-form-modal" class="modal-form">
            <div class="modal-fields">
                <div class="modal-field">
                    <span>Prioridad <span style="color: #d32f2f;">*</span></span>
                    <select name="priority" style="width: 100%; padding: 12px 14px; border: 1px solid #dce4ee; border-radius: 14px; background: #fff; color: #0f1724; font-size: 14px;">
                        <option value="Baja">Baja</option>
                        <option value="Media">Media</option>
                        <option value="Alta">Alta</option>
                    </select>
                </div>

                <div class="modal-field">
                    <span>Código <span style="color: #d32f2f;">*</span></span>
                    <input type="text" name="code" placeholder="Ej. ISO-9001-4.3" required>
                </div>

                <div class="modal-field">
                    <span>Título <span style="color: #d32f2f;">*</span></span>
                    <input type="text" name="title" placeholder="Ej. Alcance del Sistema" required>
                </div>

                <div class="modal-field">
                    <span>Descripción</span>
                    <textarea name="description" placeholder="Describe el criterio..." style="width: 100%; padding: 12px 14px; border: 1px solid #dce4ee; border-radius: 14px; background: #fff; color: #0f1724; font-size: 14px; font-family: inherit; min-height: 100px; resize: vertical;"></textarea>
                </div>

                <div class="modal-field" id="models-field-container">
                    <span>Modelos a los que pertenece este criterio</span>
                    <div id="criteria-checkbox-group" style="display: flex; flex-direction: column; gap: 10px; margin-top: 4px;"></div>
                </div>
            </div>
            <div class="modal-actions">
                <button type="submit" id="criteria-submit-btn" class="modal-submit-button">Agregar Criterio</button>
            </div>
        </form>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const accessToken = localStorage.getItem('access_token');
        const userMetadataStr = localStorage.getItem('user_metadata');

        if (!accessToken || !userMetadataStr) {
            localStorage.clear();
            window.location.href = "{% url 'select_profile' %}";
            return;
        }

        const backButton = document.getElementById('back-button');
        backButton.addEventListener('click', () => {
            localStorage.removeItem('selected_model_id');
            history.back();
        });

        // Load criteria for the model
        loadModelCriteria();
    });

    const addCriterionBtn = document.getElementById('add-criterion-btn');
    const criteriaModalOverlay = document.getElementById('criteria-modal-overlay');
    const criteriaModalClose = document.getElementById('criteria-modal-close');
    const criteriaFormModal = document.getElementById('criteria-form-modal');
    const criteriaModalTitle = document.getElementById('criteria-modal-title');
    const criteriaModalDescription = document.getElementById('criteria-modal-description');
    const criteriaCheckboxGroup = document.getElementById('criteria-checkbox-group');
    const modelsFieldContainer = document.getElementById('models-field-container');
    const criteriaSubmitBtn = document.getElementById('criteria-submit-btn');
    
    const accessToken = localStorage.getItem('access_token');
    let selectedParentCriteria = null;
    let editingCriterionId = null; 
    let selectedModelId = localStorage.getItem('selected_model_id');

    async function openCriteriaModal(parentCriteria = null, criterionToEdit = null) {
        selectedParentCriteria = parentCriteria;
        editingCriterionId = criterionToEdit ? criterionToEdit.id : null;
        criteriaCheckboxGroup.innerHTML = '';
        criteriaFormModal.reset();

        if (criterionToEdit) {
            // Modo Edición
            criteriaModalTitle.textContent = `Editar Criterio: ${criterionToEdit.code}`;
            criteriaModalDescription.textContent = `Modifica los datos del criterio.`;
            criteriaSubmitBtn.textContent = 'Guardar Cambios';

            criteriaFormModal.querySelector('[name="priority"]').value = criterionToEdit.priority || 'Baja';
            criteriaFormModal.querySelector('[name="code"]').value = criterionToEdit.code || '';
            criteriaFormModal.querySelector('[name="title"]').value = criterionToEdit.title || '';
            criteriaFormModal.querySelector('[name="description"]').value = criterionToEdit.description || '';

            if (modelsFieldContainer) {
                modelsFieldContainer.style.display = 'none';
            }
        } else if (parentCriteria) {
            // Modo Subcriterio (Ocultamos selección de modelos ya que hereda el del padre)
            criteriaModalTitle.textContent = `Agregar Subcriterio a ${parentCriteria.code}`;
            criteriaModalDescription.textContent = `Agregar un subcriterio bajo ${parentCriteria.title}.`;
            criteriaSubmitBtn.textContent = 'Agregar Subcriterio';
            if (modelsFieldContainer) modelsFieldContainer.style.display = 'none';
        } else {
            // Modo Crear Criterio Principal
            criteriaModalTitle.textContent = 'Agregar Criterio';
            criteriaModalDescription.textContent = 'Define el código, título y descripción del nuevo criterio.';
            criteriaSubmitBtn.textContent = 'Agregar Criterio';
            if (modelsFieldContainer) {
                modelsFieldContainer.style.display = 'block';
                const allModels = await API_UTILS.get("/certification_models/");
                for (const model of allModels) {
                    const checkboxItem = document.createElement('div');
                    checkboxItem.style.cssText = 'display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid #dce4ee; border-radius: 10px; background: rgba(15, 23, 36, 0.02);';
                    
                    const checkbox = document.createElement('input');
                    checkbox.type = 'checkbox';
                    checkbox.id = `criteria-modelo-${model.id}`;
                    checkbox.name = 'modelos';
                    checkbox.value = model.id;
                    checkbox.style.cssText = 'width: 16px; height: 16px; accent-color: #0b3b66; cursor: pointer;';

                    const label = document.createElement('label');
                    label.htmlFor = `criteria-modelo-${model.id}`;
                    label.style.cssText = 'cursor: pointer; margin: 0; font-size: 14px; color: #0f1724;';
                    label.textContent = `${model.title} - ${model.accreditor}`;

                    if(model.id == selectedModelId){
                        checkbox.checked = true;
                        label.textContent += " (modelo actual)";
                    }

                    checkboxItem.appendChild(checkbox);
                    checkboxItem.appendChild(label);
                    criteriaCheckboxGroup.appendChild(checkboxItem);
                }
            }
        }

        criteriaModalOverlay.classList.remove('hidden');
    }

    function closeCriteriaModal() {
        criteriaModalOverlay.classList.add('hidden');
        criteriaFormModal.reset();
        selectedParentCriteria = null;
        editingCriterionId = null;
        if (modelsFieldContainer) modelsFieldContainer.style.display = 'block';
    }

    addCriterionBtn.addEventListener('click', async () => {
        await openCriteriaModal();
    });

    criteriaModalClose.addEventListener('click', closeCriteriaModal);
    criteriaModalOverlay.addEventListener('click', (event) => {
        if (event.target === event.currentTarget) closeCriteriaModal();
    });

    criteriaFormModal.addEventListener('submit', async (event) => {
        event.preventDefault();
        const formData = new FormData(criteriaFormModal);

        const sharedValues = {
            parent: selectedParentCriteria ? selectedParentCriteria.id : null,
            priority: formData.get('priority'),
            code: formData.get('code'),
            title: formData.get('title'),
            description: formData.get('description'),
        };

        try {
            criteriaSubmitBtn.disabled = true;
            criteriaSubmitBtn.innerText = editingCriterionId ? 'Guardando...' : 'Agregando...';

            if (editingCriterionId) {
                // Actualizar criterio existente vía PATCH
                await API_UTILS.patch("/criteria/", editingCriterionId, sharedValues);
            } else if (selectedParentCriteria) {
                // Crear un subcriterio directamente asociado al modelo actual y al padre
                const subcriterionData = {
                    certification_model: parseInt(selectedModelId),
                    ...sharedValues,
                };
                await API_UTILS.post("/criteria/", subcriterionData);
            } else {
                // Crear nuevos criterios principales seleccionados
                const modelIDs = formData.getAll('modelos');
                for (const modelID of modelIDs) {
                    const criteria = {
                        certification_model: modelID,
                        ...sharedValues,
                    }
                    await API_UTILS.post("/criteria/", criteria);
                }
            }
            closeCriteriaModal();
            await loadModelCriteria();
        } catch (error) {
            console.error('Error:', error);
            alert('Ocurrió un error al guardar el criterio.');
        } finally {
            criteriaSubmitBtn.disabled = false;
            criteriaSubmitBtn.innerText = editingCriterionId ? 'Guardar Cambios' : 'Agregar Criterio';
        }
    });

    async function loadModelCriteria() {
        const modelId = localStorage.getItem('selected_model_id');
        if (!modelId) {
            console.error('No model ID found');
            return;
        }

        // Get all criteria for this model
        const criteria = await API_UTILS.get_filter_by_column(
            "/criteria/",
            "certification_model",
            modelId
        );

        // Organize criteria into tree structure
        const rootCriteria = criteria.filter(c => c.parent === null);
        
        // Build and render the tree
        const container = document.getElementById('criteria-container');
        container.innerHTML = '';

        for (const criterion of rootCriteria) {
            const element = await buildCriterionElement(criterion, criteria);
            container.appendChild(element);
        }
    }

    async function buildCriterionElement(criterion, allCriteria) {
        const div = document.createElement('div');
        div.className = 'criterion-item';
        
        const criteriaTasks = await API_UTILS.get_filter_by_column(
            "/tasks/",
            "criterion",
            criterion.id
        );

        // Check if this criterion has subcriteria
        const subCriteria = allCriteria.filter(c => c.parent === criterion.id);
        const hasChildren = subCriteria.length > 0;

        let html = '<div class="criterion-header">';

        if (hasChildren) {
            html += `
                <button class="collapse-btn" aria-expanded="true" aria-label="Expandir/contraer">
                    ▼
                </button>
            `;
        } else {
            html += '<div class="collapse-btn-placeholder"></div>';
        }

        const criterionName = `${criterion.code}: ${criterion.title}`;

        // Mapeo de prioridad a clases y etiquetas legibles
        let priorityClass = 'in-review';
        let priorityText = criterion.priority || 'Media';
        if (priorityText === 'Alta') {
            priorityClass = 'rejected'; // Estilo rojo para alta prioridad
        } else if (priorityText === 'Baja') {
            priorityClass = 'approved'; // Estilo verde para baja prioridad
        } else {
            priorityClass = 'in-review'; // Estilo naranja para media prioridad
        }

        html += `
            <span class="criterion-name">${criterionName}</span>
            <span class="evidence-status ${priorityClass}">${priorityText}</span>
            <div class="criterion-actions">
                <span class="task-count">${criteriaTasks.length} tareas</span>
                <button class="action-btn view-tasks-btn" title="Ver tareas">
                    <img src="{% static 'frontend/svgs/task.svg' %}" width="16" height="16">
                </button>
                <button class="action-btn edit-btn" title="Editar criterio">
                    <img src="{% static 'frontend/svgs/edit.svg' %}" width="16" height="16">
                </button>
                <button class="action-btn delete-btn" title="Eliminar criterio">
                    <img src="{% static 'frontend/svgs/trash.svg' %}" width="16" height="16">
                </button>
                <button class="action-btn add-subcriteria-btn" title="Agregar subcriterio">
                    <img src="{% static 'frontend/svgs/plus.svg' %}" width="16" height="16">
                </button>
            </div>
        </div>
        `;

        if (hasChildren) {
            html += '<div class="subcriteria-container" style="display: block;"></div>';
        }

        div.innerHTML = html;

        // Listener para Agregar Subcriterio
        let addSubcriteriaBtn = div.querySelector('.add-subcriteria-btn');
        if (addSubcriteriaBtn) {
            addSubcriteriaBtn.addEventListener('click', () => {
                openCriteriaModal(criterion);
            });
        }

        // Listener para Ver Tareas
        let viewTasksBtn = div.querySelector('.view-tasks-btn');
        if (viewTasksBtn) {
            viewTasksBtn.addEventListener('click', () => {
                localStorage.setItem("selected_criteria_id", criterion.id);
                window.location.href = "{% url 'criteria_tasks' %}";
            });
        }

        // Listener para Editar Criterio
        let editBtn = div.querySelector('.edit-btn');
        if (editBtn) {
            editBtn.addEventListener('click', () => {
                openCriteriaModal(null, criterion);
            });
        }

        // Listener para Eliminar Criterio
        let deleteBtn = div.querySelector('.delete-btn');
        if (deleteBtn) {
            deleteBtn.addEventListener('click', async () => {
                if (confirm(`¿Estás seguro de que deseas eliminar el criterio "${criterion.code}"?`)) {
                    try {
                        await API_UTILS.delete("/criteria/", criterion.id);
                        await loadModelCriteria();
                    } catch (error) {
                        console.error('Error al eliminar:', error);
                        alert('Ocurrió un error al eliminar el criterio.');
                    }
                }
            });
        }

        // Add collapse functionality
        if (hasChildren) {
            const collapseBtn = div.querySelector('.collapse-btn');
            const subcriteriaContainer = div.querySelector('.subcriteria-container');

            collapseBtn.addEventListener('click', () => {
                const isExpanded = collapseBtn.getAttribute('aria-expanded') === 'true';
                collapseBtn.setAttribute('aria-expanded', !isExpanded);
                subcriteriaContainer.style.display = isExpanded ? 'none' : 'block';
                collapseBtn.textContent = isExpanded ? '▶' : '▼';
            });

            // Populate subcriteria
            for (const sub of subCriteria) {
                const subElement = await buildCriterionElement(sub, allCriteria);
                subElement.classList.add('subcriteria-item');
                subcriteriaContainer.appendChild(subElement);
            }
        }

        return div;
    }
</script>
{% endblock %}

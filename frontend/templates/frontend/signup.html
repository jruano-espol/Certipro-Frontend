{% extends "frontend/base.html" %}
{% load static %}

{% block content %}
<link rel="stylesheet" href="{% static 'frontend/signup.css' %}">
<a class="back" href="{% url 'select_profile' %}" aria-label="Volver">
  <!-- left arrow icon -->
  <svg viewBox="0 0 20 20" fill="none" width="18" height="18" aria-hidden="true">
    <path d="M11 15L6 10l5-5" stroke="#3b4854" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  Regresar
</a>

<div class="signup">
    <div class="title">
      <h1 id="signup-heading">Crear Cuenta</h1>
      <p class="subtitle">Su rol será asignado por un administrador.</p>
    </div>

    <div id="error-message" 
    style="color: #e63946; background-color: #ffe3e3; padding: 10px; border-radius: 6px; 
    margin-bottom: 15px; display: none; font-size: 14px; border: 1px solid #e63946;"></div>

    <form id="signup-form">
      <div class="field">
        <label for="name">Nombre</label>
        <div class="input" aria-hidden="false">
          <input id="name" type="text" value="" autocomplete="off" required />
        </div>
      </div>

      <div class="field">
        <label for="surname">Apellido</label>
        <div class="input" aria-hidden="false">
          <input id="surname" type="text" value="" autocomplete="off" required />
        </div>
      </div>

      <div class="field">
        <label for="email">Correo Electrónico</label>
        <div class="input" aria-hidden="false">
          <!-- mail icon -->
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M3 7.5v9A2.5 2.5 0 0 0 5.5 19h13a2.5 2.5 0 0 0 2.5-2.5v-9" stroke="#9aa3ad" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M21 7.5 12 13 3 7.5" stroke="#9aa3ad" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <input id="email" type="email" placeholder="tu@correo.com" value="" autocomplete="email" required />
        </div>
      </div>

      <div class="field">
        <label for="password">Contraseña</label>
        <div class="input">
          <!-- lock icon -->
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <rect x="3.5" y="10.5" width="17" height="10" rx="2" ry="2" stroke="#9aa3ad" stroke-width="1.4" />
            <path d="M7 10.5V8a5 5 0 0 1 10 0v2.5" stroke="#9aa3ad" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <input id="password" type="password" placeholder="••••••••" autocomplete="new-password" required />
          <button type="button" class="toggle-password" aria-label="Mostrar contraseña">
            <!-- eye icon -->
            <svg class="eye-open" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M12 5C7 5 2.73 8.11 1 12.46c1.73 4.35 6 7.54 11 7.54s9.27-3.19 11-7.54C21.27 8.11 17 5 12 5zm0 12.5c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z" fill="#9aa3ad"/>
            </svg>
            <svg class="eye-closed" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="display:none;">
              <path d="M11.83 9L5.5 2.67A1 1 0 104.08 4.08l16.24 16.24a1 1 0 001.42-1.42L20.49 19.83a11.804 11.804 0 001.12-4.37C23.27 8.11 17 5 12 5c-1.42 0-2.78.25-4.07.67l2.9 2.9zM12 16.5a4.5 4.5 0 01-4.5-4.5c0-.64.13-1.26.36-1.83l2.73 2.73c.09.35.32.63.63.87l2.73 2.73c-.57.23-1.18.36-1.83.36zm8.3-2.04C19.47 16.29 16 19 12 19s-7.47-2.71-8.3-4.54a11.7 11.7 0 011.12-2.39l2.08 2.08A4.5 4.5 0 0016.22 14l2.08 2.08c.46-.67.86-1.41 1.12-2.2z" fill="#9aa3ad"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="field">
        <label for="phone">Número de Teléfono</label>
        <div class="input" aria-hidden="false">
          <!-- phone icon -->
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M6.62 10.79a15.46 15.46 0 0 0 6.59 6.59l2.2-2.2a1 1 0 0 1 1.01-.24c1.12.37 2.33.57 3.58.57a1 1 0 0 1 1 1V20a1 1 0 0 1-1 1C11.16 21 3 12.84 3 3a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.46.57 3.58a1 1 0 0 1-.24 1.01l-2.21 2.2Z" stroke="#9aa3ad" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <input id="phone" type="tel" placeholder="+593 (9) 123-4567" autocomplete="tel" />
        </div>
      </div>

      <button type="submit" class="btn">Crear Cuenta</button>
    </form>
</div>
<footer class="dim-text">
    <small>CertiPro © 2026 - Proyecto Académico</small>
</footer>

<script>
  const toggleBtn = document.querySelector('.toggle-password');
  const passwordInput = document.getElementById('password');
  const eyeOpen = document.querySelector('.eye-open');
  const eyeClosed = document.querySelector('.eye-closed');

  toggleBtn.addEventListener('click', (e) => {
    e.preventDefault();
    const isPassword = passwordInput.type === 'password';
    passwordInput.type = isPassword ? 'text' : 'password';
    eyeOpen.style.display = isPassword ? 'none' : 'block';
    eyeClosed.style.display = isPassword ? 'block' : 'none';
    toggleBtn.setAttribute('aria-label', isPassword ? 'Ocultar contraseña' : 'Mostrar contraseña');
  });

  document.getElementById('signup-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    history.back();
  });
</script>

{% endblock %}
